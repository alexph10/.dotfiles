# Starter pre-commit config. Copy into a new repo as `.pre-commit-config.yaml`,
# then run `pre-commit install` (or rely on the init.templatedir trick documented
# in the dotfiles README).
#
# Run all hooks on demand:  pre-commit run --all-files
# Update hook versions:     pre-commit autoupdate

minimum_pre_commit_version: "3.6.0"

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, jsonc, yaml, markdown, css, scss, html]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: [-i, "4", -ci, -w]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: forbid-todo-fixme-on-main
        name: forbid TODO/FIXME on main
        entry: bash -c '! git diff --cached --name-only -z | xargs -0 grep -nE "^\s*(TODO|FIXME)\b" 2>/dev/null'
        language: system
        stages: [pre-commit]
        pass_filenames: false
        verbose: true
